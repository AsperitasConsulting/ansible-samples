---
- name: Execute basic commands on target hosts
  hosts: all
  gather_facts: false
  vars:
    azure_keyvault_name: "your-keyvault-name"
    key_secret_name: "your-pem-key-secret-name"
    azure_keyvault_rg: "your-keyvault-rg"
  
  tasks:
    - name: Install Azure CLI dependencies
      raw: |
        sudo apt-get update && \
        sudo apt-get install -y python3-pip && \
        sudo pip3 install azure-cli msrestazure azure-identity azure-mgmt-keyvault

    - name: Get Key Vault secret
      azure.azcollection.azure_rm_keyvaultsecret_info:
        vault_uri: "https://{{ azure_keyvault_name }}.vault.azure.net"
        name: "{{ key_secret_name }}"
        auth_source: env
      register: secret_result
      environment:
        AZURE_CLIENT_ID: "{{ lookup('env', 'AZURE_CLIENT_ID') }}"
        AZURE_SECRET: "{{ lookup('env', 'AZURE_SECRET') }}"
        AZURE_TENANT: "{{ lookup('env', 'AZURE_TENANT') }}"
        AZURE_SUBSCRIPTION_ID: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"

    - name: Save PEM key to file
      copy:
        content: "{{ secret_result.secrets[0].secret }}"
        dest: "ansible-ssh-private-key.pem"
        mode: '0600'

    - name: Install required Python packages
      raw: |
        sudo apt-get update && \
        sudo apt-get install -y python3-future python3-setuptools && \
        sudo pip3 install 'typing-extensions>=3.7.4' 'future>=0.18.2'
        
    - name: Test SSH connectivity with simple command
      raw: "python3 -c 'print(\"hello\")'"
      register: test_result

    - name: Display test result
      debug:
        var: test_result

